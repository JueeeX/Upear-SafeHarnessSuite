[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "upear"
version = "0.1.0a1"
description = "Upear lifecycle security runtime for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Upear contributors" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.scripts]
safeharness-audit = "safeharness.audit_cli:main"
safeharness-postgres-init = "safeharness.postgres_cli:main"
safeharness-coordination-init = "safeharness.coordination_cli:main"
safeharness-communication-init = "safeharness.communication_cli:main"
safeharness-communication-maintain = "safeharness.communication_maintenance:main"
safeharness-admin-ui = "safeharness.admin_ui.server:main"

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
agents = ["openai-agents>=0.18.3,<0.19"]
crypto = ["cryptography>=43,<46"]
langgraph = [
  "langgraph>=1.0",
  "langchain-core>=1.0",
  "langchain-openai>=1.0",
]
production = [
  "cryptography>=43,<46",
  "psycopg[binary]>=3.1,<4",
  "redis>=5,<7",
]
observability = [
  "opentelemetry-sdk>=1.25,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.25,<2",
]
evaluation = [
  "datasets>=2.14",
  "matplotlib>=3.7",
  "pyyaml>=6.0",
  "requests>=2.28",
]
dev = [
  "build>=1.2",
  "cryptography>=43,<46",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["safeharness*"]

[tool.setuptools.package-data]
safeharness = [
  "py.typed",
  "admin_ui/static/*.css",
  "admin_ui/static/*.html",
  "admin_ui/static/*.js",
  "posture_profiles/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100
